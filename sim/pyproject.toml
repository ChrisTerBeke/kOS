[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kos-sim"
version = "0.1.0"
description = "Offline KerboScript/kOS runtime and Kerbin physics host for E2E CI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lark>=1.1",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kos-sim = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kos_host*", "kos_runtime*", "sim_host*", "harness*"]

[tool.setuptools.package-data]
kos_runtime = ["grammar.lark"]
sim_host = []
harness = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
